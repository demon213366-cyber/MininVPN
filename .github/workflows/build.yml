name: Build MininVPN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create MininVPN Android App
        run: |
          mkdir -p app/src/main/java/com/minin/vpn/ui/theme app/src/main/java/com/minin/vpn/service app/src/main/res/values
          
          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MininVPN"
          include(":app")
          EOF

          # build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          # gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          # app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.minin.vpn"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.minin.vpn"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0-CYBER"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <application android:label="MININ VPN" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".service.MininVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">
                      <intent-filter><action android:name="android.net.VpnService" /></intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # Theme.kt
          cat << 'EOF' > app/src/main/java/com/minin/vpn/ui/theme/Theme.kt
          package com.minin.vpn.ui.theme
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          val CyberBackground = Color(0xFF07080C)
          val CyberSurface = Color(0xFF10121B)
          val CyberCyan = Color(0xFF00F0FF)
          val CyberPink = Color(0xFFFF0055)
          val CyberYellow = Color(0xFFFFE600)
          val CyberGreen = Color(0xFF00FF66)
          val CyberText = Color(0xFFE2E8F0)
          @Composable
          fun MininVpnTheme(content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = DarkColorScheme(background = CyberBackground, surface = CyberSurface, primary = CyberCyan), content = content)
          }
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/minin/vpn/MainActivity.kt
          package com.minin.vpn
          import android.content.Intent
          import android.net.VpnService
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.*
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.*
          import com.minin.vpn.service.MininVpnService
          import com.minin.vpn.ui.theme.*

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MininVpnTheme {
                          var isConnected by remember { mutableStateOf(false) }
                          Surface(modifier = Modifier.fillMaxSize(), color = CyberBackground) {
                              Column(
                                  modifier = Modifier.fillMaxSize().padding(24.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.SpaceBetween
                              ) {
                                  Text("MININ VPN", fontSize = 32.sp, fontWeight = FontWeight.Black, color = CyberCyan)
                                  Box(
                                      modifier = Modifier
                                          .size(160.dp)
                                          .clip(CircleShape)
                                          .background(CyberSurface)
                                          .border(2.dp, if (isConnected) CyberGreen else CyberPink, CircleShape)
                                          .clickable { isConnected = !isConnected },
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Text(if (isConnected) "ONLINE" else "OFFLINE", color = if (isConnected) CyberGreen else CyberPink, fontWeight = FontWeight.Bold)
                                  }
                                  Text("AMNEZIAWG PROTOCOL", color = CyberYellow, fontSize = 12.sp)
                              }
                          }
                      }
                  }
              }
          }
          EOF

          # MininVpnService.kt
          cat << 'EOF' > app/src/main/java/com/minin/vpn/service/MininVpnService.kt
          package com.minin.vpn.service
          import android.net.VpnService

          class MininVpnService : VpnService()
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MininVPN-Cyberpunk
          path: app/build/outputs/apk/debug/app-debug.apk
